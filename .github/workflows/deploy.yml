name: Deploy

# git push в main = продакшен-деплой всех трёх воркеров.
# Сборка Next.js→Workers (OpenNext) должна выполняться на Linux,
# поэтому деплой сайта и админки живёт здесь, а не на Windows-машине.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: d53bbe9911ff202a91f3f4220bcbe1aa

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Проверки (линт, типы, тесты)
        run: pnpm turbo run lint typecheck test

      - name: Деплой API
        run: pnpm --filter @tver/api exec wrangler deploy

      - name: Миграции БД (прод)
        run: pnpm --filter @tver/api exec wrangler d1 migrations apply DB --remote

      - name: Деплой сайта
        run: pnpm --filter @tver/web run deploy

      - name: Деплой админки
        run: pnpm --filter @tver/admin run deploy

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # версию pnpm берёт из packageManager в package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Линт, типы, тесты, сборка
        run: pnpm turbo run lint typecheck test build

      # Сканер уязвимостей зависимостей (P2/M11): только prod-зависимости,
      # non-blocking — оставшиеся high транзитивные и только build-time
      # (postcss/source-map-js/sharp/nanoid в сборке, не в рантайме Workers).
      # Прямые рантайм-зависимости ведёт Dependabot (.github/dependabot.yml).
      - name: Аудит зависимостей
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      # Сканер утекших секретов в истории и PR (P2/M11).
      # Только на push: на pull_request от Dependabot у GITHUB_TOKEN нет прав
      # на артефакты/комментарии и шаг падает ошибкой доступа, а не находкой.
      # Смерженный код всё равно сканируется пушем в main.
      - name: Gitleaks
        if: github.event_name == 'push'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

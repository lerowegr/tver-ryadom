[project]
name = "tver-ryadom-api"
version = "0.1.0"
description = "API сайта экскурсий «Тверь рядом» на FastAPI"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.40",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "boto3>=1.40",
    "pillow>=11.0",
    "apscheduler>=3.11",
    "python-multipart>=0.0.20",
    # База часовых поясов: на Windows её нет вовсе, в slim-образе полагаться
    # на системную — значит однажды получить расписание со сдвигом на час.
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "mypy>=1.18",
    "pytest-asyncio>=1.0",
    "aiosqlite>=0.21",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Каждый тест получает свою базу, поэтому общий цикл событий не нужен.
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
# Миграции генерирует Alembic: переформатировать их под свой стиль
# бессмысленно, следующая автогенерация всё вернёт.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001-003: в комментариях и строках кириллица, и «похожие» символы здесь норма.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Внешние пакеты без аннотаций не должны валить проверку своего кода.
ignore_missing_imports = true
